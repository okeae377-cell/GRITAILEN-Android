
name: GRITAILEN Android Build

on:
  push:
    branches: [utama]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - name: Ambil file proyek
        uses: actions/checkout@v4

      - name: Ekstrak proyek game
        run: |
          mkdir game
          unzip -q GRITAILEN-Android-Prototipe.zip -d game

      - name: Periksa proyek Godot
        run: |
          test -f game/project.godot
          godot --headless --path game --editor --quit

      - name: Simpan proyek
        uses: actions/upload-artifact@v4
        with:
          name: GRITAILEN-Android-Project
          path: game/
          
